<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threlkeld Nature Watch — 1/3 &amp; 1/4 Page Summary</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/docx@9.6.1/dist/index.umd.cjs"></script>
<style>
  :root { --ink: #111111; --ink-soft: #444444; --paper: #ffffff; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #d9d9d9;
    font-family: Calibri, Candara, 'Segoe UI', Optima, Arial, sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  .controls {
    max-width: 500px; margin: 16px auto 4px; display: flex; gap: 10px;
    justify-content: center; align-items: center; flex-wrap: wrap;
  }
  /* Size toggle is its own segmented-control group, visually distinct from
     the plain action buttons below it - a Download button and a size
     button used to look identical (both solid black), which is exactly
     why it wasn't clear which size was being previewed. */
  .size-toggle {
    display: inline-flex; background: #e2e2e2; border-radius: 7px; padding: 3px; gap: 2px;
  }
  .size-toggle button {
    font-family: Calibri, Candara, 'Segoe UI', Optima, Arial, sans-serif; font-size: 13px; font-weight: 600;
    background: transparent; color: #333; border: none; border-radius: 5px;
    padding: 7px 14px; cursor: pointer;
  }
  .size-toggle button.active { background: #111; color: #fff; }
  .size-toggle button:not(.active):hover { background: #d2d2d2; }

  .action-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .action-group button {
    font-family: Calibri, Candara, 'Segoe UI', Optima, Arial, sans-serif; font-size: 13px; font-weight: 600;
    background: #111; color: #fff; border: none; border-radius: 4px;
    padding: 7px 16px; cursor: pointer;
  }
  .action-group button:hover { background: #333; }

  .controls .hint { width: 100%; text-align: center; font-size: 11px; color: #555; margin-top: 2px; }

  /* Large, plain-language label sat directly above the preview it describes,
     so which size is showing is obvious at a glance without reading the
     toggle state - updated by render() every time the size changes. */
  .preview-label {
    max-width: 148mm; margin: 4px auto 10px; text-align: center;
    font-size: 13px; font-weight: 600; color: #111;
  }

  /* #sheet is always full A5 width (148mm) - "1/3" and "1/4" only ever
     change its HEIGHT, to true fractions of the 210mm A5 height (70mm /
     52.5mm). Font and chart sizes are set per-size in applyProfile() so
     the actual content fits for real at that height, at full width -
     this is a genuine preview of the final page, not a scaled thumbnail,
     and downloadPDF/JPG/Word all capture this same sheet as-is. */
  .sheet-preview { display: flex; justify-content: center; margin: 0 auto 24px; }
  .sheet {
    width: 148mm; background: var(--paper);
    position: relative;
    box-shadow: 0 2px 14px rgba(0,0,0,0.25);
    overflow: hidden; /* safety net only, in case a period's text is unusually long */
  }

  .title-line { margin: 0 0 3px; }
  .title-line .brand { font-weight: 700; }
  .title-line .range { font-style: italic; margin-left: 5px; }

  .body-text { margin: 0 0 4px; }

  .charts-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4mm;
    margin: 2px 0 4px;
  }
  .chart-col { min-width: 0; }
  .chart-holder { position: relative; min-width: 0; }

  .caption { font-style: italic; color: var(--ink-soft); margin: 0; }

</style>
</head>
<body>

  <div class="controls">
    <div class="size-toggle">
      <button id="btnThird" onclick="setSize('third')">1/3 Page</button>
      <button id="btnQuarter" onclick="setSize('quarter')">1/4 Page</button>
    </div>
    <div class="action-group">
      <button onclick="downloadPDF()">Download PDF</button>
      <button onclick="downloadJPG()">Download JPG</button>
      <button onclick="downloadWord()">Download Word</button>
    </div>
    <div class="hint">A5 width · black &amp; white · shown true-size for a 1/3 or 1/4 page slot in the parish magazine</div>
  </div>

  <div class="preview-label" id="previewLabel">Previewing: 1/3 page (true size)</div>

  <div class="sheet-preview" id="sheetPreview">
    <div class="sheet" id="sheet">
      <p class="title-line">
        <span class="brand">Threlkeld Nature Watch</span><span class="range" id="rangeText">— 25 August to 24 September 2026</span>
      </p>
      <p class="body-text" id="bodyText">Loading…</p>
      <div class="charts-row">
        <div class="chart-col"><div class="chart-holder"><canvas id="birdMiniChart"></canvas></div></div>
        <div class="chart-col"><div class="chart-holder"><canvas id="batMiniChart"></canvas></div></div>
        <div class="chart-col"><div class="chart-holder"><canvas id="weatherMiniChart"></canvas></div></div>
      </div>
      <p class="caption">Top birds, bats, and this period's weather. Full data: threlkeld.info</p>
    </div>
  </div>

<script>
  // ===== DATA — combines monthly/<id>.json (weather) + wildlife/<id>.json,
  // the same JSON the full review pages already read. ?m=<id> selects the
  // period. Both must exist for a period to render here (the archive on
  // bb.html only lists ids present in both indexes).
  const NR_BASE = 'https://rlpzmepeautd1v5pgoumz9aa2qhd92xd.ui.nabu.casa';

  function sampleData() {
    return {
      weather: {
        monthName: '25 August to 24 September 2026 (sample)',
        summary: 'A settled, unremarkable spell for the valley. Rain fell on eleven days for a total of 48.2mm, well within the typical range, with the warmest afternoon reaching 19.3°C.',
        stats: { rainTotal:'48.2', tMax:'19.3', tMin:'6.1' },
      },
      wildlife: {
        summary: 'Bird activity held steady through the month, with jackdaws again the most-recorded visitor. Bat passes picked up on the mildest nights, led by the common pipistrelle.',
        topSpecies: [ { name:'Eurasian Jackdaw', count:12000 }, { name:'Common Chaffinch', count:3400 }, { name:'Dunnock', count:1200 } ],
        topBatSpecies: [ { name:'Common Pipistrelle', count:4200 }, { name:'Soprano Pipistrelle', count:1800 }, { name:"Nathusius' Pipistrelle", count:900 } ],
      },
    };
  }

  let DATA = null;
  let SIZE = 'third';

  // First N sentences of a paragraph - a plain, automatic way to compress the
  // AI-written naturalist summary down to a highlight or two, without needing
  // someone to hand-pick highlights every period.
  function firstSentences(text, n) {
    if (!text) return '';
    // Some summaries lead with a markdown heading line (e.g. "# Threlkeld
    // Wildlife Notes: July Observations") before the actual prose — strip
    // any such leading heading block so it doesn't leak into the display.
    let cleaned = text.replace(/^\s*#{1,6}[^\n]*\n+/, '').trim();
    if (!cleaned) cleaned = text.trim();
    // Protect decimal points (e.g. "42.6") from being mistaken for sentence
    // endings by the split below, then restore them afterwards.
    const protectedText = cleaned.replace(/(\d)\.(\d)/g, '$1\u0000$2');
    const parts = protectedText.match(/[^.!?]+[.!?]+/g) || [protectedText];
    const restore = s => s.replace(/\u0000/g, '.').trim();
    return parts.slice(0, n).map(restore).join(' ').trim();
  }

  function buildBodyText(size) {
    const w = DATA.weather || {}, wl = DATA.wildlife || {};
    const n = size === 'third' ? 2 : 1;
    const weatherBit = firstSentences(w.summary, n);
    const wildlifeBit = firstSentences(wl.summary, n);
    return [weatherBit, wildlifeBit].filter(Boolean).join(' ');
  }

  // Bat detections come through under their scientific names (e.g.
  // "Pipistrellus pipistrellus") from the acoustic classifier - translate
  // to the common English names people actually recognise, for display
  // only. Covers the UK's breeding bat species; anything not listed here
  // (a name already in plain English, or one we haven't seen yet) just
  // passes through unchanged.
  const BAT_COMMON_NAMES = {
    'Pipistrellus pipistrellus': 'Common Pipistrelle',
    'Pipistrellus pygmaeus': 'Soprano Pipistrelle',
    'Pipistrellus nathusii': "Nathusius' Pipistrelle",
    'Nyctalus noctula': 'Noctule',
    'Nyctalus leisleri': "Leisler's Bat",
    'Eptesicus serotinus': 'Serotine',
    'Myotis daubentonii': "Daubenton's Bat",
    'Myotis nattereri': "Natterer's Bat",
    'Myotis brandtii': "Brandt's Bat",
    'Myotis mystacinus': 'Whiskered Bat',
    'Myotis alcathoe': 'Alcathoe Bat',
    'Myotis bechsteinii': "Bechstein's Bat",
    'Plecotus auritus': 'Brown Long-eared Bat',
    'Plecotus austriacus': 'Grey Long-eared Bat',
    'Barbastella barbastellus': 'Barbastelle',
    'Rhinolophus hipposideros': 'Lesser Horseshoe Bat',
    'Rhinolophus ferrumequinum': 'Greater Horseshoe Bat',
  };
  function friendlyBatSpecies(list) {
    return (list || []).map(s => ({ ...s, name: BAT_COMMON_NAMES[s.name] || s.name }));
  }

  // #sheet is always full A5 width - "third"/"quarter" only change its
  // height (a true fraction of 210mm) and the type/chart sizes needed to
  // genuinely fit real content in that height, not a scaled-down view of
  // the full-size sheet. This is the one place both the preview and the
  // downloads (which capture #sheet as-is) get their dimensions from.
  const SHEET_PROFILE = {
    third:   { heightMm: 210 / 3, padMm: 6, brandPt: 8,   rangePt: 6.5, bodyPt: 7,   bodyLH: 1.3,  chartMm: 15, capPt: 5,   speciesN: 3 },
    // At 10mm the chart-holder simply doesn't have room for 3 clean species
    // rows (tried it - labels start colliding even with the tightened
    // layout), so the quarter size shows the top 2 species instead of 3.
    quarter: { heightMm: 210 / 4, padMm: 5, brandPt: 7,   rangePt: 5.5, bodyPt: 6,   bodyLH: 1.25, chartMm: 10, capPt: 4.5, speciesN: 2 },
  };
  function applyProfile() {
    const p = SHEET_PROFILE[SIZE];
    const sheetEl = document.getElementById('sheet');
    sheetEl.style.height = p.heightMm + 'mm';
    sheetEl.style.padding = p.padMm + 'mm';
    document.querySelector('.brand').style.fontSize = p.brandPt + 'pt';
    document.querySelector('.range').style.fontSize = p.rangePt + 'pt';
    const bodyEl = document.getElementById('bodyText');
    bodyEl.style.fontSize = p.bodyPt + 'pt';
    bodyEl.style.lineHeight = p.bodyLH;
    document.querySelectorAll('.chart-holder').forEach(el => el.style.height = p.chartMm + 'mm');
    document.querySelector('.caption').style.fontSize = p.capPt + 'pt';
  }

  function render() {
    const w = DATA.weather || {}, wl = DATA.wildlife || {};
    document.getElementById('rangeText').textContent = '— ' + (w.monthName || wl.monthName || '');
    document.getElementById('bodyText').textContent = buildBodyText(SIZE);
    document.getElementById('previewLabel').textContent = SIZE === 'third' ? 'Previewing: 1/3 page (true size)' : 'Previewing: 1/4 page (true size)';
    document.getElementById('btnThird').className = SIZE === 'third' ? 'active' : '';
    document.getElementById('btnQuarter').className = SIZE === 'quarter' ? 'active' : '';
    applyProfile();
    buildCharts();
  }

  function setSize(size) { SIZE = size; render(); }

  async function loadData() {
    const params = new URLSearchParams(location.search);
    const id = params.get('m');
    let weather = null, wildlife = null;
    if (id) {
      try { const r = await fetch(NR_BASE + '/local/monthly/' + id + '.json', { cache:'no-store' }); if (r.ok) weather = await r.json(); } catch(e) {}
      try { const r = await fetch(NR_BASE + '/local/wildlife/' + id + '.json', { cache:'no-store' }); if (r.ok) wildlife = await r.json(); } catch(e) {}
    }
    DATA = (weather || wildlife) ? { weather: weather || {}, wildlife: wildlife || {} } : sampleData();
    render();
  }

  // ===== Mini charts (black & white, matching the site's established style) =====
  Chart.defaults.color = '#111';
  Chart.defaults.borderColor = 'rgba(0,0,0,0.12)';
  Chart.defaults.font.family = "Calibri, Candara, 'Segoe UI', Optima, Arial, sans-serif";
  Chart.defaults.font.size = 6;

  const noLegend = { plugins: { legend: { display:false } }, maintainAspectRatio:false };

  // Same transparent bar style everywhere (white fill, black border) - draws
  // the actual value (e.g. "10mm", "12,000") right on each bar, since the
  // axis alone doesn't give an exact reading at this size.
  const BAR_STYLE = { backgroundColor: '#fff', borderColor: '#000', borderWidth: 1 };
  function valueLabelPlugin(formatter) {
    return {
      id: 'valueLabels',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        const meta = chart.getDatasetMeta(0);
        const data = chart.data.datasets[0].data;
        const horizontal = chart.options.indexAxis === 'y';
        ctx.save();
        ctx.fillStyle = '#111';
        ctx.font = "bold 7px Calibri, Candara, 'Segoe UI', Optima, Arial, sans-serif";
        meta.data.forEach((bar, i) => {
          const text = formatter(data[i], i);
          if (horizontal) {
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, bar.x + 4, bar.y);
          } else {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(text, bar.x, bar.y - 3);
          }
        });
        ctx.restore();
      }
    };
  }

  // Species mini-charts draw their own name + value labels rather than relying
  // on Chart.js's native y-axis tick labels: at this size (a handful of px per
  // row) those ticks have no collision-avoidance for category axes and just
  // overlap each other once names get long. This plugin sizes the font to the
  // actual row height, truncates a name that still won't fit, and places the
  // name in the gap above its own bar (reserved via categoryPercentage) so
  // rows can never collide.
  function speciesLabelPlugin(formatter) {
    return {
      id: 'speciesLabels',
      afterDatasetsDraw(chart) {
        const { ctx, chartArea } = chart;
        const meta = chart.getDatasetMeta(0);
        const data = chart.data.datasets[0].data;
        const labels = chart.data.labels;
        const rowH = meta.data.length ? (chartArea.bottom - chartArea.top) / meta.data.length : 8;
        const fontPx = Math.max(4.5, Math.min(6, rowH * 0.4));
        const maxW = Math.max(20, chartArea.right - chartArea.left - 4);
        ctx.save();
        ctx.fillStyle = '#111';
        meta.data.forEach((bar, i) => {
          ctx.font = fontPx + "px Calibri, Candara, 'Segoe UI', Optima, Arial, sans-serif";
          ctx.textAlign = 'left';
          ctx.textBaseline = 'alphabetic';
          let name = String(labels[i] || '');
          if (ctx.measureText(name).width > maxW) {
            while (name.length > 3 && ctx.measureText(name + '…').width > maxW) name = name.slice(0, -1);
            name = name.replace(/\s+$/, '') + '…';
          }
          ctx.fillText(name, chartArea.left, bar.y - bar.height / 2 - 1.5);

          ctx.font = "bold " + fontPx + "px Calibri, Candara, 'Segoe UI', Optima, Arial, sans-serif";
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(formatter(data[i], i), bar.x + 4, bar.y);
        });
        ctx.restore();
      }
    };
  }

  let _charts = [];
  function speciesBarChart(canvasId, list, n) {
    const top = (list || []).slice(0, n || 3);
    if (!top.length) return null;
    return new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: { labels: top.map(s=>s.name), datasets: [ { data: top.map(s=>s.count), ...BAR_STYLE, barPercentage:0.5, categoryPercentage:0.9 } ] },
      options: { ...noLegend, indexAxis:'y',
        // Reserve room above the plot area so the topmost bar's name label
        // (drawn by speciesLabelPlugin, above its bar) doesn't get clipped
        // against the canvas edge - there's no category above it to borrow
        // gap space from the way the other rows can.
        layout: { padding: { top: 8 } },
        scales: { x: { grid:{ color:'rgba(0,0,0,0.08)' }, ticks:{ maxTicksLimit:2 }, grace:'30%' },
                  y: { grid:{ display:false }, ticks:{ display:false } } } },
      plugins: [ speciesLabelPlugin(v => v.toLocaleString('en-GB')) ]
    });
  }
  function weatherBarChart(canvasId, w) {
    const S = w.stats || {};
    const vals = [ parseFloat(S.rainTotal)||0, parseFloat(S.tMax)||0, parseFloat(S.tMin)||0 ];
    const units = ['mm', '°C', '°C'];
    return new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: { labels: ['Rain (mm)','Max (°C)','Min (°C)'], datasets: [ { data: vals, ...BAR_STYLE } ] },
      options: { ...noLegend,
        scales: { x: { grid:{ display:false }, ticks:{ font:{size:6} } },
                  y: { grid:{ color:'rgba(0,0,0,0.08)' }, ticks:{ maxTicksLimit:2 }, grace:'20%' } },
      },
      plugins: [ valueLabelPlugin((v, i) => (Math.round(v*10)/10) + units[i]) ]
    });
  }

  function buildCharts() {
    _charts.forEach(c => { if (c) { try { c.destroy(); } catch(e){} } });
    _charts = [];
    const wl = DATA.wildlife || {}, w = DATA.weather || {};
    const n = SHEET_PROFILE[SIZE].speciesN;
    _charts.push(speciesBarChart('birdMiniChart', wl.topSpecies, n));
    _charts.push(speciesBarChart('batMiniChart', friendlyBatSpecies(wl.topBatSpecies), n));
    _charts.push(weatherBarChart('weatherMiniChart', w));
  }

  loadData();

  // ===== Download helpers =====
  function stamp() {
    const label = (DATA.weather && DATA.weather.monthName) || (DATA.wildlife && DATA.wildlife.monthName) || 'review';
    return (label + '-' + SIZE).replace(/\s+/g,'-').toLowerCase();
  }

  async function capture() {
    const sheet = document.getElementById('sheet');
    // #sheet is already the real, final size (see SHEET_PROFILE/applyProfile) -
    // what's on screen is exactly what gets captured, no adjustment needed.
    return await html2canvas(sheet, { scale: 3, backgroundColor:'#ffffff', useCORS:true });
  }
  async function downloadJPG() {
    const canvas = await capture();
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/jpeg', 0.95);
    a.download = 'blencathra-summary-' + stamp() + '.jpg';
    a.click();
  }
  async function downloadPDF() {
    const canvas = await capture();
    const img = canvas.toDataURL('image/jpeg', 0.95);
    const { jsPDF } = window.jspdf;
    const hMm = SHEET_PROFILE[SIZE].heightMm;
    const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:[148, hMm] });
    pdf.addImage(img, 'JPEG', 0, 0, 148, hMm);
    pdf.save('blencathra-summary-' + stamp() + '.pdf');
  }

  function dataURLtoUint8Array(dataURL) {
    const base64 = dataURL.split(',')[1];
    const bin = atob(base64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function downloadWord() {
    const { Document, Packer, Paragraph, TextRun, ImageRun, Table, TableRow, TableCell,
            WidthType, BorderStyle, AlignmentType, VerticalAlign, convertMillimetersToTwip } = window.docx;
    const FONT = 'Calibri';
    const p = SHEET_PROFILE[SIZE];
    // docx `size` is in half-points.
    const TITLE_PT = Math.round(p.brandPt * 2);
    const RANGE_PT = Math.round(p.rangePt * 2);
    const BODY_PT = Math.round(p.bodyPt * 2);
    const CAP_PT = Math.round(p.capPt * 2);

    const PAGE_W = convertMillimetersToTwip(148);
    const PAGE_H = convertMillimetersToTwip(p.heightMm);
    const MARGIN = convertMillimetersToTwip(p.padMm);
    const CONTENT_W_TWIP = PAGE_W - 2 * MARGIN;

    const w = DATA.weather || {}, wl = DATA.wildlife || {};
    const rangeText = w.monthName || wl.monthName || '';

    const titlePara = new Paragraph({
      spacing: { after: 60 },
      children: [
        new TextRun({ text: 'Threlkeld Nature Watch', font: FONT, size: TITLE_PT, bold: true }),
        new TextRun({ text: '  —  ' + rangeText, font: FONT, size: RANGE_PT, italics: true }),
      ],
    });
    const bodyPara = new Paragraph({
      spacing: { after: 60 },
      children: [ new TextRun({ text: buildBodyText(SIZE), font: FONT, size: BODY_PT }) ],
    });

    const NO_BORDER = { style: BorderStyle.NONE, size: 0, color: 'FFFFFF' };
    const NO_BORDERS = { top: NO_BORDER, bottom: NO_BORDER, left: NO_BORDER, right: NO_BORDER };

    function canvasImage(id) {
      const c = document.getElementById(id);
      if (!c) return null;
      const dataUrl = c.toDataURL('image/png');
      return { data: dataURLtoUint8Array(dataUrl), wPx: c.width, hPx: c.height };
    }
    const specs = ['birdMiniChart','batMiniChart','weatherMiniChart'].map(canvasImage).filter(Boolean);
    let chartsRow = null;
    if (specs.length) {
      const colWidth = Math.floor(CONTENT_W_TWIP / specs.length);
      const targetWidthPt = 118;
      const aligns = [AlignmentType.LEFT, AlignmentType.CENTER, AlignmentType.RIGHT];
      const cells = specs.map((s, i) => {
        const scale = targetWidthPt / s.wPx;
        return new TableCell({
          width: { size: colWidth, type: WidthType.DXA }, borders: NO_BORDERS, verticalAlign: VerticalAlign.CENTER,
          margins: { top:0, bottom:0, left:0, right:0 },
          children: [ new Paragraph({ alignment: aligns[i] || AlignmentType.CENTER, children: [
            new ImageRun({ type:'png', data: s.data, transformation: { width: Math.round(s.wPx*scale), height: Math.round(s.hPx*scale) } }) ] }) ],
        });
      });
      chartsRow = new Table({ width: { size: CONTENT_W_TWIP, type: WidthType.DXA }, borders: NO_BORDERS, rows: [ new TableRow({ children: cells }) ] });
    }

    const captionPara = new Paragraph({
      spacing: { before: 60 },
      children: [ new TextRun({ text: "Top birds, bats, and this period's weather. Full data: threlkeld.info", font: FONT, size: CAP_PT, italics: true }) ],
    });

    const children = [ titlePara, bodyPara ];
    if (chartsRow) children.push(chartsRow);
    children.push(captionPara);

    const doc = new Document({
      sections: [{
        properties: { page: { size: { width: PAGE_W, height: PAGE_H }, margin: { top: MARGIN, bottom: MARGIN, left: MARGIN, right: MARGIN } } },
        children,
      }],
    });
    const blob = await Packer.toBlob(doc);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'blencathra-summary-' + stamp() + '.docx';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
</script>
</body>
</html>
